name: Telegram Cloud Task Executor

on:
  repository_dispatch:
    types: [telegram_task]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL'
        required: false
        default: 'https://news.ycombinator.com'
      instructions:
        description: 'Task instructions'
        required: false
        default: 'Capture screenshot'

jobs:
  run-browser-task:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Execute Browser Automation
        env:
          TARGET_URL: ${{ github.event.client_payload.target_url || github.event.inputs.target_url || 'https://news.ycombinator.com' }}
          INSTRUCTIONS: ${{ github.event.client_payload.instructions || github.event.inputs.instructions || 'Capture screenshot' }}
          TELEGRAM_CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python cloud_runner.py
